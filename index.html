<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Countdown</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: transparent;
    margin: 0;
    padding: 0;
  }

  /* defaults for light themes, dark theme colours below */
  .card {
    width: 100%;
    max-width: none;
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 0;
    padding: 1.5rem 1.75rem;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.25rem;
  }

  .card-title {
    font-size: 18px;
    font-weight: 500;
    color: #111;
  }

  .edit-toggle {
    background: none;
    border: none;
    cursor: pointer;
    color: #bbb;
    font-size: 18px;
    padding: 2px 4px;
    line-height: 1;
    transition: color 0.15s;
  }
  .edit-toggle:hover { color: #555; }

  .edit-panel {
    background: #f9f9f9;
    border: 1px solid #e5e5e5;
    border-radius: 16px;
    padding: 1.1rem 1.25rem;
    margin-bottom: 1.25rem;
    display: none;
    flex-direction: column;
    gap: 12px;
  }
  .edit-panel.open { display: flex; }

  .edit-panel label {
    font-size: 11px;
    color: #999;
    display: block;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .edit-panel input,
  .edit-panel input[type='checkbox'] {
    font-size: 14px;
    font-family: inherit;
  }

  .edit-panel input[type='text'],
  .edit-panel input[type='date'],
  .edit-panel input[type='number'] {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    background: #fff;
    color: #111;
  }
  .edit-panel input[type='checkbox'] {
    width: auto;
    margin-right: 8px;
  }
  .edit-panel input:focus { outline: none; border-color: #bbb; }

  .time-row {
    display: flex;
    gap: 8px;
  }
  .time-row input { flex: 1; }

  .unit {
    background: #f5f5f5;
    border-radius: 12px;
    padding: 0.7rem 0.3rem;
    text-align: center;
    min-width: 0;
  }

  .unit-toggle {
    display: none;
    margin-top: 0.8rem;
    justify-content: center;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #555;
  }
  .unit-toggle input {
    width: auto;
    margin: 0;
  }

  .edit-panel.open + .units .unit-toggle {
    display: inline-flex;
  }

  .edit-panel.open + .units .unit {
    display: block !important;
  }

  .save-btn {
    align-self: flex-start;
    font-size: 13px;
    padding: 7px 16px;
    border: 1px solid #ddd;
    border-radius: 10px;
    background: #fff;
    cursor: pointer;
    font-family: inherit;
    color: #333;
    transition: background 0.15s;
  }
  .save-btn:hover { background: #f0f0f0; }

  .units {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .unit {
    background: #f5f5f5;
    border-radius: 12px;
    padding: 0.7rem 0.3rem;
    text-align: center;
    min-width: 0;
  }

  .unit-val {
    font-size: 26px;
    font-weight: 500;
    color: #111;
    line-height: 1.1;
  }

  .edit-panel.open + .units .unit-val {
    display: none;
  }

  .unit-label {
    font-size: 10px;
    color: #aaa;
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .edit-panel.open + .units .unit-label {
    font-size: 26px;
    font-weight: 500;
    color: #111;
    margin-top: 0;
    text-transform: capitalize;
    letter-spacing: normal;
  }

  .done {
    font-size: 16px;
    color: #aaa;
    text-align: center;
    padding: 1.5rem 0;
  }


  /* for dark themes */
  @media (prefers-color-scheme: dark) {
    .card { background: #1e1e1e; border-color: #333; }
    .card-title { color: #f0f0f0; }
    .edit-toggle { color: #666; }
    .edit-toggle:hover { color: #bbb; }
    .edit-panel { background: #252525; border-color: #3a3a3a; }
    .edit-panel label { color: #777; }
    .edit-panel input { background: #1e1e1e; border-color: #444; color: #f0f0f0; }
    .save-btn { background: #2a2a2a; border-color: #444; color: #ccc; }
    .save-btn:hover { background: #333; }
    .unit { background: #2a2a2a; }
    .unit-val { color: #f0f0f0; }
    .unit-label { color: #666; }
    .edit-panel.open + .units .unit-label { color: #f0f0f0; }
    .edit-panel.open + .units .unit-toggle { color: #bbb; }
    .unit-toggle { color: #bbb; }
    .done { color: #666; }
  }
</style>
</head>


<body>
<div class="card">
  <!-- header -->
  <div class="card-header">
    <p class="card-title" id="title">Countdown</p>
    <button class="edit-toggle" id="edit-btn" aria-label="Edit settings">✎</button>
  </div>

  <!-- edit menu -->
  <div class="edit-panel" id="edit-panel">
    <div>
      <label for="input-title">Title</label>
      <input type="text" id="input-title" placeholder="Event title" />
    </div>
    <div>
      <label for="input-date">Date</label>
      <input type="date" id="input-date" />
    </div>
    <div>
      <label>Time (24h)</label>
      <div class="time-row">
        <input type="number" id="input-hour" placeholder="HH" min="0" max="23" />
        <input type="number" id="input-min" placeholder="MM" min="0" max="59" />
        <input type="number" id="input-sec" placeholder="SS" min="0" max="59" />
      </div>
    </div>
    <button class="save-btn" id="save-btn">Save</button>
  </div>

  <!-- each of the time fields -->
  <div class="units" id="units">
    <div class="unit" data-unit="years"><div class="unit-val" id="u-years">--</div><div class="unit-label">Years</div><label class="unit-toggle"><input type="checkbox" id="input-show-years" /> Show</label></div>
    <div class="unit" data-unit="months"><div class="unit-val" id="u-months">--</div><div class="unit-label">Months</div><label class="unit-toggle"><input type="checkbox" id="input-show-months" /> Show</label></div>
    <div class="unit" data-unit="days"><div class="unit-val" id="u-days">--</div><div class="unit-label">Days</div><label class="unit-toggle"><input type="checkbox" id="input-show-days" /> Show</label></div>
    <div class="unit" data-unit="hours"><div class="unit-val" id="u-hours">--</div><div class="unit-label">Hours</div><label class="unit-toggle"><input type="checkbox" id="input-show-hours" /> Show</label></div>
    <div class="unit" data-unit="mins"><div class="unit-val" id="u-mins">--</div><div class="unit-label">Minutes</div><label class="unit-toggle"><input type="checkbox" id="input-show-mins" /> Show</label></div>
    <div class="unit" data-unit="secs"><div class="unit-val" id="u-secs">--</div><div class="unit-label">Seconds</div><label class="unit-toggle"><input type="checkbox" id="input-show-secs" /> Show</label></div>
  </div>

  <div class="done" id="done" style="display:none">That day has passed.</div>
</div>

<script>
  // cache local storage key
  const KEY = 'notion-countdown-v1';

  const titleEl  = document.getElementById('title');
  const editBtn  = document.getElementById('edit-btn');
  const panel    = document.getElementById('edit-panel');
  const inTitle  = document.getElementById('input-title');
  const inDate   = document.getElementById('input-date');
  const inHour   = document.getElementById('input-hour');
  const inMin    = document.getElementById('input-min');
  const inSec    = document.getElementById('input-sec');
  const inShowMonths = document.getElementById('input-show-months');
  const inShowDays   = document.getElementById('input-show-days');
  const inShowHours  = document.getElementById('input-show-hours');
  const inShowMins   = document.getElementById('input-show-mins');
  const inShowSecs   = document.getElementById('input-show-secs');
  const inShowYears  = document.getElementById('input-show-years');
  const saveBtn  = document.getElementById('save-btn');
  const unitsEl  = document.getElementById('units');
  const doneEl   = document.getElementById('done');
  const unitEls  = {
    years:  document.querySelector('[data-unit="years"]'),
    months: document.querySelector('[data-unit="months"]'),
    days:   document.querySelector('[data-unit="days"]'),
    hours:  document.querySelector('[data-unit="hours"]'),
    mins:   document.querySelector('[data-unit="mins"]'),
    secs:   document.querySelector('[data-unit="secs"]'),
  };
  const unitValues = {
    years:  document.getElementById('u-years'),
    months: document.getElementById('u-months'),
    days:   document.getElementById('u-days'),
    hours:  document.getElementById('u-hours'),
    mins:   document.getElementById('u-mins'),
    secs:   document.getElementById('u-secs'),
  };

  // pad digits to begin with 0 for display 
  function pad(n) { return String(n).padStart(2, '0'); }

  // reads data from local storage
  function loadData() {
    try { return JSON.parse(localStorage.getItem(KEY)) || {}; }
    catch { return {}; }
  }

  // populate form fields from data
  function populateForm(d) {
    titleEl.textContent = d.title || 'Countdown';
    inTitle.value = d.title || '';
    inDate.value  = d.date  || '';
    inHour.value  = d.hour != null ? d.hour : '';
    inMin.value   = d.min  != null ? d.min  : '';
    inSec.value   = d.sec  != null ? d.sec  : '';
    inShowYears.checked  = d.showYears  !== false;
    inShowMonths.checked = d.showMonths !== false;
    inShowDays.checked   = d.showDays   !== false;
    inShowHours.checked  = d.showHours  !== false;
    inShowMins.checked   = d.showMins   !== false;
    inShowSecs.checked   = d.showSecs   !== false;
  }

  // core logic. updates every second
  function tick() {
    const d = loadData();
    if (!d.date) return;

    const hour = parseInt(d.hour) || 0;
    const min  = parseInt(d.min)  || 0;
    const sec  = parseInt(d.sec)  || 0;
    const [y2, m2, day2] = d.date.split('-').map(Number);
    const target = new Date(y2, m2 - 1, day2, hour, min, sec);
    const now = new Date();

    if (target <= now) {
      unitsEl.style.display = 'none';
      doneEl.style.display  = 'block';
      return;
    }

    unitsEl.style.display = '';
    doneEl.style.display  = 'none';

    const settings = {
      showYears:  d.showYears  !== false,
      showMonths: d.showMonths !== false,
      showDays:   d.showDays   !== false,
      showHours:  d.showHours  !== false,
      showMins:   d.showMins   !== false,
      showSecs:   d.showSecs   !== false,
    };

    const totalSeconds = Math.floor((target - now) / 1000);
    let years = 0;
    let months = 0;
    let remaining = totalSeconds;

    if (settings.showYears) {
      years = y2 - now.getFullYear();
      if (years < 0) years = 0;
      const base = new Date(
        now.getFullYear() + years, now.getMonth(), now.getDate(),
        now.getHours(), now.getMinutes(), now.getSeconds()
      );
      remaining = Math.max(0, Math.floor((target - base) / 1000));
    }

    if (settings.showMonths) {
      months = (y2 - now.getFullYear()) * 12 + (m2 - 1 - now.getMonth());
      if (day2 < now.getDate()) months--;
      if (months < 0) months = 0;
      months -= years * 12;
      const base = new Date(
        now.getFullYear() + years, now.getMonth() + months, now.getDate(),
        now.getHours(), now.getMinutes(), now.getSeconds()
      );
      remaining = Math.max(0, Math.floor((target - base) / 1000));
    }

    const anySelected = settings.showYears || settings.showMonths || settings.showDays || settings.showHours || settings.showMins || settings.showSecs;
    if (!anySelected) settings.showSecs = true;

    const parts = { years, months, days: 0, hours: 0, mins: 0, secs: 0 };
    let cursor = (settings.showYears || settings.showMonths) ? remaining : totalSeconds;

    if (settings.showDays) {
      parts.days = Math.floor(cursor / 86400);
      cursor %= 86400;
    }
    if (settings.showHours) {
      parts.hours = Math.floor(cursor / 3600);
      cursor %= 3600;
    }
    if (settings.showMins) {
      parts.mins = Math.floor(cursor / 60);
      cursor %= 60;
    }
    if (settings.showSecs) {
      parts.secs = cursor;
    }

    if (!settings.showYears && !settings.showMonths && settings.showDays === false && settings.showHours) {
      parts.hours = Math.floor(totalSeconds / 3600);
      if (settings.showMins) {
        cursor = totalSeconds % 3600;
        parts.mins = Math.floor(cursor / 60);
        cursor %= 60;
        if (settings.showSecs) parts.secs = cursor;
      }
    }
    if (!settings.showYears && !settings.showMonths && settings.showDays === false && settings.showHours === false && settings.showMins) {
      parts.mins = Math.floor(totalSeconds / 60);
      if (settings.showSecs) parts.secs = totalSeconds % 60;
    }
    if (!settings.showYears && !settings.showMonths && settings.showDays && !settings.showHours && settings.showMins) {
      cursor = Math.floor(totalSeconds % 86400);
      parts.mins = Math.floor(cursor / 60);
      if (settings.showSecs) parts.secs = cursor % 60;
    }
    if (!settings.showYears && !settings.showMonths && !settings.showDays && !settings.showHours && !settings.showMins && settings.showSecs) {
      parts.secs = totalSeconds;
    }

    unitValues.years.textContent = parts.years;
    unitValues.months.textContent = parts.months;
    unitValues.days.textContent = parts.days;
    unitValues.hours.textContent = parts.hours;
    unitValues.mins.textContent = parts.mins;
    unitValues.secs.textContent = parts.secs;

    unitEls.years.style.display   = settings.showYears   ? '' : 'none';
    unitEls.months.style.display = settings.showMonths ? '' : 'none';
    unitEls.days.style.display   = settings.showDays   ? '' : 'none';
    unitEls.hours.style.display  = settings.showHours  ? '' : 'none';
    unitEls.mins.style.display   = settings.showMins   ? '' : 'none';
    unitEls.secs.style.display   = settings.showSecs   ? '' : 'none';
    updateGridColumns();
  }

  // toggles the .open class of the panel
  editBtn.addEventListener('click', () => panel.classList.toggle('open'));

  // updates grid columns based on visible units
  function updateGridColumns() {
    const visibleCount = Object.values(unitEls).filter(el => el.style.display !== 'none').length;
    unitsEl.style.gridTemplateColumns = `repeat(${visibleCount}, 1fr)`;
  }

  // writes values entered to local storage
  saveBtn.addEventListener('click', () => {
    const data = {
      title: inTitle.value.trim(),
      date:  inDate.value,
      hour:  parseInt(inHour.value) || 0,
      min:   parseInt(inMin.value)  || 0,
      sec:   parseInt(inSec.value)  || 0,
      showYears:  inShowYears.checked,
      showMonths: inShowMonths.checked,
      showDays:   inShowDays.checked,
      showHours:  inShowHours.checked,
      showMins:   inShowMins.checked,
      showSecs:   inShowSecs.checked,
    };
    localStorage.setItem(KEY, JSON.stringify(data));
    populateForm(data);
    panel.classList.remove('open');
    tick();
  });

  // init population and tick
  populateForm(loadData());
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
