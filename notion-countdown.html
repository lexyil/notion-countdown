<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Countdown</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    /* font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 1rem; */
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: transparent;
    margin: 0;
    padding: 0;
  }

  .card {
    width: 100%;
    max-width: none;
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 0;
    padding: 1.5rem 1.75rem;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.25rem;
  }

  .card-title {
    font-size: 18px;
    font-weight: 500;
    color: #111;
  }

  .edit-toggle {
    background: none;
    border: none;
    cursor: pointer;
    color: #bbb;
    font-size: 18px;
    padding: 2px 4px;
    line-height: 1;
    transition: color 0.15s;
  }
  .edit-toggle:hover { color: #555; }

  .edit-panel {
    background: #f9f9f9;
    border: 1px solid #e5e5e5;
    border-radius: 16px;
    padding: 1.1rem 1.25rem;
    margin-bottom: 1.25rem;
    display: none;
    flex-direction: column;
    gap: 12px;
  }
  .edit-panel.open { display: flex; }

  .edit-panel label {
    font-size: 11px;
    color: #999;
    display: block;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .edit-panel input {
    width: 100%;
    font-size: 14px;
    padding: 8px 12px;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    background: #fff;
    color: #111;
    font-family: inherit;
  }
  .edit-panel input:focus { outline: none; border-color: #bbb; }

  .time-row {
    display: flex;
    gap: 8px;
  }
  .time-row input { flex: 1; }

  .save-btn {
    align-self: flex-start;
    font-size: 13px;
    padding: 7px 16px;
    border: 1px solid #ddd;
    border-radius: 10px;
    background: #fff;
    cursor: pointer;
    font-family: inherit;
    color: #333;
    transition: background 0.15s;
  }
  .save-btn:hover { background: #f0f0f0; }

  .units {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }

  .unit {
    background: #f5f5f5;
    border-radius: 12px;
    padding: 0.9rem 0.4rem;
    text-align: center;
  }

  .unit-val {
    font-size: 26px;
    font-weight: 500;
    color: #111;
    line-height: 1.1;
  }

  .unit-label {
    font-size: 10px;
    color: #aaa;
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .done {
    font-size: 16px;
    color: #aaa;
    text-align: center;
    padding: 1.5rem 0;
  }

  @media (prefers-color-scheme: dark) {
    .card { background: #1e1e1e; border-color: #333; }
    .card-title { color: #f0f0f0; }
    .edit-toggle { color: #666; }
    .edit-toggle:hover { color: #bbb; }
    .edit-panel { background: #252525; border-color: #3a3a3a; }
    .edit-panel label { color: #777; }
    .edit-panel input { background: #1e1e1e; border-color: #444; color: #f0f0f0; }
    .save-btn { background: #2a2a2a; border-color: #444; color: #ccc; }
    .save-btn:hover { background: #333; }
    .unit { background: #2a2a2a; }
    .unit-val { color: #f0f0f0; }
    .unit-label { color: #666; }
    .done { color: #666; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="card-header">
    <p class="card-title" id="title">Countdown</p>
    <button class="edit-toggle" id="edit-btn" aria-label="Edit settings">✎</button>
  </div>

  <div class="edit-panel" id="edit-panel">
    <div>
      <label for="input-title">Title</label>
      <input type="text" id="input-title" placeholder="Event title" />
    </div>
    <div>
      <label for="input-date">Date</label>
      <input type="date" id="input-date" />
    </div>
    <div>
      <label>Time (24h)</label>
      <div class="time-row">
        <input type="number" id="input-hour" placeholder="HH" min="0" max="23" />
        <input type="number" id="input-min" placeholder="MM" min="0" max="59" />
        <input type="number" id="input-sec" placeholder="SS" min="0" max="59" />
      </div>
    </div>
    <button class="save-btn" id="save-btn">Save</button>
  </div>

  <div class="units" id="units">
    <div class="unit"><div class="unit-val" id="u-months">--</div><div class="unit-label">Months</div></div>
    <div class="unit"><div class="unit-val" id="u-days">--</div><div class="unit-label">Days</div></div>
    <div class="unit"><div class="unit-val" id="u-hours">--</div><div class="unit-label">Hours</div></div>
    <div class="unit"><div class="unit-val" id="u-mins">--</div><div class="unit-label">Minutes</div></div>
    <div class="unit"><div class="unit-val" id="u-secs">--</div><div class="unit-label">Seconds</div></div>
  </div>

  <div class="done" id="done" style="display:none">That day has passed.</div>
</div>

<script>
  const KEY = 'notion-countdown-v1';

  const titleEl  = document.getElementById('title');
  const editBtn  = document.getElementById('edit-btn');
  const panel    = document.getElementById('edit-panel');
  const inTitle  = document.getElementById('input-title');
  const inDate   = document.getElementById('input-date');
  const inHour   = document.getElementById('input-hour');
  const inMin    = document.getElementById('input-min');
  const inSec    = document.getElementById('input-sec');
  const saveBtn  = document.getElementById('save-btn');
  const unitsEl  = document.getElementById('units');
  const doneEl   = document.getElementById('done');

  function pad(n) { return String(n).padStart(2, '0'); }

  function loadData() {
    try { return JSON.parse(localStorage.getItem(KEY)) || {}; }
    catch { return {}; }
  }

  function populateForm(d) {
    titleEl.textContent = d.title || 'Countdown';
    inTitle.value = d.title || '';
    inDate.value  = d.date  || '';
    inHour.value  = d.hour != null ? d.hour : '';
    inMin.value   = d.min  != null ? d.min  : '';
    inSec.value   = d.sec  != null ? d.sec  : '';
  }

  function tick() {
    const d = loadData();
    if (!d.date) return;

    const hour = parseInt(d.hour) || 0;
    const min  = parseInt(d.min)  || 0;
    const sec  = parseInt(d.sec)  || 0;

    // build target from stored parts
    const [y2, m2, day2] = d.date.split('-').map(Number);
    const target = new Date(y2, m2 - 1, day2, hour, min, sec);
    const now    = new Date();

    if (target <= now) {
      unitsEl.style.display = 'none';
      doneEl.style.display  = 'block';
      return;
    }

    unitsEl.style.display = '';
    doneEl.style.display  = 'none';

    // months component
    let months = (y2 - now.getFullYear()) * 12 + (m2 - 1 - now.getMonth());
    if (day2 < now.getDate()) months--;
    if (months < 0) months = 0;

    // remaining after whole months
    const base = new Date(
      now.getFullYear(), now.getMonth() + months, now.getDate(),
      now.getHours(), now.getMinutes(), now.getSeconds()
    );

    const diff  = Math.floor((target - base) / 1000);
    const days  = Math.floor(diff / 86400);
    const hours = Math.floor((diff % 86400) / 3600);
    const mins  = Math.floor((diff % 3600) / 60);
    const secs  = diff % 60;

    document.getElementById('u-months').textContent = months;
    document.getElementById('u-days').textContent   = days;
    document.getElementById('u-hours').textContent  = hours;
    document.getElementById('u-mins').textContent   = mins;
    document.getElementById('u-secs').textContent   = secs;
  }

  editBtn.addEventListener('click', () => panel.classList.toggle('open'));

  saveBtn.addEventListener('click', () => {
    const data = {
      title: inTitle.value.trim(),
      date:  inDate.value,
      hour:  parseInt(inHour.value) || 0,
      min:   parseInt(inMin.value)  || 0,
      sec:   parseInt(inSec.value)  || 0,
    };
    localStorage.setItem(KEY, JSON.stringify(data));
    populateForm(data);
    panel.classList.remove('open');
    tick();
  });

  populateForm(loadData());
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
